[project]
name = "bluesky-gym"
version = "0.1.0"
dependencies = [
    "bluesky-simulator",
    "torch==2.2.0",
    "pygame==2.5.2",
    "gymnasium",
    "stable-baselines3==2.2.1",
    "numpy==1.24",
    "bluesky-simulator",
]

authors = [
  { name="Jan Groot", email="d.j.groot@tudelft.nl" },
  { name="Joost Ellerbroek", email="j.ellerbroek@tudelft.nl" },
  { name="Giulia Leto", email="g.leto@tudelft.nl" },
  { name="Sasha Vlaskin", email="a.vlaskin@tudelft.nl" },
]
description = "A gymnasium style environment for standardized Reinforcement Learning research in Air Traffic Management."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",

    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",

    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/TUDelft-CNS-ATM/bluesky-gym"
Issues = "https://github.com/TUDelft-CNS-ATM/bluesky-gym/issues"

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.sdist]
# include = [
#   "bluesky_gym/*",
# ]

[tool.poetry]
name = "rbe-595-reinforcement-learning-project"
version = "0.1.0"
description = "A gymnasium style environment for standardized Reinforcement Learning research in Air Traffic Management."
authors = ["Gregory Jones <greggie119gj@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "2.2.3"
torch = {version = "^2.6.0+cu118", source = "pytorch-gpu-src"}
torchvision = {version = "^0.21.0+cu118", source = "pytorch-gpu-src"}
torchaudio = {version = "^2.6.0+cu118", source = "pytorch-gpu-src"}
gymnasium = {extras = ["box2d"], version = "^1.1.1"}
tensorboard = "^2.19.0"
debugpy = "^1.8.13"
pygame = "^2.6.1"
scipy = "^1.15.2"
stable-baselines3 = {extras = ["extra"], version = "^2.6.0"}

[[tool.poetry.source]]
name = "pytorch-gpu-src"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
